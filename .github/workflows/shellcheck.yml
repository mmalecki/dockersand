name: ShellCheck

on:
  push:
    paths:
      - '**/*.sh'
      - '**/*.bash'
      - 'dockersand*'
      - 'tests/**'
      - 'egress-proxy/**'
  pull_request:
    paths:
      - '**/*.sh'
      - '**/*.bash'
      - 'dockersand*'
      - 'tests/**'
      - 'egress-proxy/**'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: >-
            .github
          severity: warning
          check_together: true

      - name: Test launcher
        run: bash tests/launcher.sh

      - name: Test clone remote destinations
        run: bash tests/remotes.sh

      - name: Test D-Bus forwarding
        run: bash tests/dbus.sh

      - name: Test egress proxy setup
        run: bash tests/egress.sh

      - name: Test sessions
        run: bash tests/sessions.sh
