name: ShellCheck

on:
  push:
    paths:
      - '**/*.sh'
      - '**/*.bash'
      - 'dockersand*'
      - 'tests/**'
  pull_request:
    paths:
      - '**/*.sh'
      - '**/*.bash'
      - 'dockersand*'
      - 'tests/**'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: >-
            .github
          severity: warning
          check_together: true

      - name: Test launcher
        run: bash tests/launcher.sh
