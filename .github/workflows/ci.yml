name: CI

on:
  push:
    paths: &paths
      - '**/*.sh'
      - '**/*.bash'
      - 'dockersand*'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths: *paths

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          check_together: true

      - name: Test launcher
        run: bash tests/launcher.sh

      - name: Test clone remote destinations
        run: bash tests/remotes.sh

      - name: Test D-Bus forwarding
        run: bash tests/dbus.sh

      - name: Test sessions
        run: bash tests/sessions.sh

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # From gVisor's apt repository, which its docs recommend over the
      # release files, whose layout changes
      - name: Install gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key |
            sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" |
            sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          # The package registers runsc with Docker, but without this flag
          sudo runsc install -- --host-uds=open
          sudo systemctl reload docker
          docker info --format '{{with index .Runtimes "runsc"}}runsc: {{.Path}} {{.Args}}{{end}}'

      - name: Test real sandboxes
        run: bash tests/live.sh
