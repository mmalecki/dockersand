name: CI

on:
  push:
    paths: &paths
      - '**/*.sh'
      - '**/*.bash'
      - 'dockersand*'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths: *paths

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          check_together: true

      - name: Test launcher
        run: bash tests/launcher.sh

      - name: Test clone remote destinations
        run: bash tests/remotes.sh

      - name: Test D-Bus forwarding
        run: bash tests/dbus.sh

      - name: Test sessions
        run: bash tests/sessions.sh
