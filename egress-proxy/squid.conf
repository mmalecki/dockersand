http_port 3128

# Pure filter, no caching
cache deny all

# Developer privacy: keep the machine's internal IPs and proxy details out of
# outgoing request headers
via off
forwarded_for delete

acl allowed dstdomain .anthropic.com .claude.ai .claude.com \
    .openai.com .chatgpt.com \
    .github.com .githubusercontent.com \
    registry.npmjs.org pypi.org files.pythonhosted.org
acl ssh_hosts dstdomain github.com ssh.github.com
acl private dst "/etc/squid/private.acl"
acl SSL_ports port 443
acl SSH_ports port 22
acl CONNECT method CONNECT

# The host, as named by extra_hosts in docker-compose.yml. Blocked unless you
# uncomment the allow rules below, which must stay above `deny private` (it
# matches on the resolved IP).
acl host_services dstdomain host.docker.internal
acl host_ports port 9931

# http_access allow host_services host_ports
# http_access allow CONNECT host_services host_ports

# No reaching the host, LAN or cloud metadata, even via an allowed name
http_access deny private
http_access allow CONNECT SSH_ports ssh_hosts
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all
