http_port 3128

# Pure filter, no caching
cache deny all

# Developer privacy: keep the machine's internal IPs and proxy details out of
# outgoing request headers
via off
forwarded_for delete

acl private dst "/etc/squid/private.acl"

# The host, as named by extra_hosts in docker-compose.yml. Blocked unless you
# uncomment the allow rules below, which must stay above `deny private` (it
# matches on the resolved IP).
acl host_services dstdomain host.docker.internal
acl host_ports port 9931 # or any other host ports

# http_access allow host_services host_ports
# http_access allow CONNECT host_services host_ports

# Squid's own stats/admin interface
http_access deny manager
# No reaching the host, LAN or cloud metadata
http_access deny private
# Anything public, including CONNECT to any port (ssh tunnels through it)
http_access allow all
