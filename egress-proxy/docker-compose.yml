# Egress filtering for sandboxed workloads.
#
# Workload containers join dockersand-internal, which has no route out. The proxy
# sits on both networks and only forwards to domains allowlisted in squid.conf.
#
#   docker compose up -d
#   DOCKERSAND_EGRESS=1 dockersand run <app> [args...]

services:
  dockersand-egress-proxy:
    image: ubuntu/squid
    container_name: dockersand-egress-proxy
    restart: unless-stopped
    volumes:
      - ./squid.permissive.conf:/etc/squid/squid.conf:ro
      - ./private.acl:/etc/squid/private.acl:ro
    # Stable name for the host, resolved by the proxy. Still denied by
    # squid.conf unless explicitly allowed there.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dockersand-internal
      - dockersand-egress

networks:
  dockersand-internal:
    name: dockersand-internal
    internal: true
    # Run Docker's IPv6 setup too, so isolated mode removes link-local addresses.
    enable_ipv6: true
    # internal alone still exposes host services on the bridge gateway.
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
  dockersand-egress:
    name: dockersand-egress
