# Egress filtering for sandboxed workloads.
#
# Workload containers join dockersand-internal, which has no route out. The proxy
# sits on both networks and only forwards to domains allowlisted in squid.conf.
#
#   docker compose up -d
#   DOCKERSAND_EGRESS=1 dockersand <app> [args...]

services:
  dockersand-egress-proxy:
    image: ubuntu/squid
    container_name: dockersand-egress-proxy
    restart: unless-stopped
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    # Stable name for the host, resolved by the proxy. Still denied by
    # squid.conf unless explicitly allowed there.
    extra_hosts:
      - "host.dockersand.internal:host-gateway"
    networks:
      - dockersand-internal
      - dockersand-egress

networks:
  dockersand-internal:
    name: dockersand-internal
    internal: true
  dockersand-egress:
    name: dockersand-egress
